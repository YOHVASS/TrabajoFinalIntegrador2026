# Base de datos PostgreSQL para desarrollo local.
#   docker compose up -d
# Queda en localhost:5432, base "talleres", usuario/clave "talleres".
services:
  postgres:
    image: postgres:16
    container_name: talleres-postgres
    environment:
      POSTGRES_DB: talleres
      POSTGRES_USER: talleres
      POSTGRES_PASSWORD: talleres
    ports:
      - "5432:5432"
    volumes:
      - talleres-data:/var/lib/postgresql/data

volumes:
  talleres-data:
